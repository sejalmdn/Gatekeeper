[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gatekeeper"
version = "0.1.0"
description = "Credible evaluation of complete agent workflows"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn>=0.30,<1"]

[project.scripts]
gatekeeper = "gatekeeper.app:main"

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["B008"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gatekeeper = ["frontend_dist/**", "persistence/schema.sql"]
